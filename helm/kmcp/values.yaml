# Default values for kmcp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

# -- Override the namespace
# @default -- `.Release.Namespace`
namespaceOverride: ""

# Image configuration
image:
  repository: ghcr.io/kagent-dev/kmcp/controller
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart's appVersion.
  # Set to a specific version (e.g., "v0.1.7") to pin to that version.
  # tag: ""

# Image pull secrets for private registries
imagePullSecrets: []

# Controller configuration
controller:
  # Number of replicas
  replicaCount: 1
  
  # Leader election settings
  leaderElection:
    enabled: true
  
  # Health probe configuration
  healthProbe:
    bindAddress: ":8081"
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
  
  # Metrics configuration
  metrics:
    enabled: true
    bindAddress: ":8443"
    secureServing: true
  
  env: []

# PodDisruptionBudget for the controller pods
podDisruptionBudget:
  # Specifies whether a PodDisruptionBudget should be created
  enabled: false

  # Exactly one of minAvailable / maxUnavailable must be set.
  # Both accept an integer or a percentage string (e.g. 1 or "50%").
  # Note: minAvailable: 1 combined with controller.replicaCount: 1 blocks
  # voluntary node drains, so increase the replica count when enabling this.
  minAvailable: 1
  maxUnavailable: ""

  # Eviction policy for unhealthy pods: "IfHealthyBudget" or "AlwaysAllow".
  # Requires Kubernetes 1.27+ (beta) or 1.31+ (stable).
  # Left out of the manifest when empty.
  unhealthyPodEvictionPolicy: ""

  # Extra annotations for the PodDisruptionBudget
  annotations: {}

  # Extra labels for the PodDisruptionBudget
  labels: {}

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - "ALL"

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Service account configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# RBAC configuration
rbac:
  # Specifies whether RBAC resources should be created
  create: true

  # -- Namespaces in which to create Role and RoleBinding resources.
  # If empty (default), the chart creates cluster-scoped ClusterRole and ClusterRoleBinding
  # resources and the controller watches all namespaces.
  # If set, the chart creates a Role + RoleBinding per listed namespace and the controller's
  # WATCH_NAMESPACES is derived from this list.
  namespaces: []

# Service configuration for metrics
service:
  type: ClusterIP
  port: 8443
  targetPort: 8443
